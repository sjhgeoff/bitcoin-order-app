name: Bitcoin order app

on:
  push:
    branches: [githubcicd]
  workflow_dispatch:

concurrency:
  group: workshop6-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/githubcicd'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '16.20.2'
          cache: npm
      - name: Install dependencies
        run: npm ci --force --no-audit
      - name: Lint
        run: npm run lint
      - name: Browser unit tests
        run: npm test -- --progress=false
      - name: Build for the repository's Pages URL
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          npm run build -- --base-href "/$REPO_NAME/"
          cp dist/bitcoin/index.html dist/bitcoin/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/bitcoin

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release notes from conventional commits
        id: changelog
        uses: TriPSs/conventional-changelog-action@469f0e5e35831fbd1962706f29f65daf0a5723f2 # v6.5.0
        with:
          output-file: 'false'
          skip-git-pull: 'true'
          skip-commit: 'true'
          skip-tag: 'true'
          git-push: 'false'
      - name: Publish GitHub release and tag
        if: steps.changelog.outputs.skipped == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.clean_changelog }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  deploy:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested build to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
